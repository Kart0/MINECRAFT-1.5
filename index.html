<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="browserTitle">Actualizador |MC 1.5|</title>
    <!-- Incluir Marked.js para soporte Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* (CSS completo, igual que antes) */
        @font-face {
            font-family: 'Minecraft';
            src: url('media_files/MinecraftRegular-Bmg3.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }
        
        @font-face {
            font-family: 'Minecraft';
            src: url('media_files/MinecraftBold-nMK1.otf') format('opentype');
            font-weight: bold;
            font-style: normal;
        }
        
        @font-face {
            font-family: 'Minecraft';
            src: url('media_files/MinecraftItalic-R8Mo.otf') format('opentype');
            font-weight: normal;
            font-style: italic;
        }
        
        @font-face {
            font-family: 'Minecraft';
            src: url('media_files/MinecraftBoldItalic-1y1e.otf') format('opentype');
            font-weight: bold;
            font-style: italic;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Minecraft', Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .video-background video {
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            object-fit: cover;
        }

        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: -1;
        }

        .header {
            width: 100%;
            padding: 4vh 2vw 2vh 2vw;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .logo {
            height: 25vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo img {
            height: 100%;
            width: auto;
            max-width: 85vw;
            object-fit: contain;
        }

        .content-container {
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4vh 4vw;
            gap: 3vw;
        }

        .sidebar {
            width: 250px;
            height: 60vh;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.3);
            padding: 15px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            font-size: 1.1em;
            overflow-y: auto;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
        }

        .main-content {
            flex: 1;
            height: 60vh;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.3);
            padding: 0px 15px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            font-size: 1.1em;
            overflow-y: auto;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
        }

        /* Botones fijos */
        .kofi-button {
            position: fixed;
            top: 30px;
            left: 45px;
            width: 75px;
            height: 75px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            background: transparent;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            color: white;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
        }

        .kofi-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('media_files/mc2_kofisupport.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -1;
            transition: all 0.3s ease;
            border-radius: 0;
        }

        .kofi-button:hover::before {
            background-image: url('media_files/mc2_kofisupport_hovered.png');
        }

        .kofi-button:hover {
            transform: translateY(-3px);
        }

        .kofi-button:active {
            transform: translateY(0);
        }

        .lang-button {
            position: fixed;
            top: 30px;
            right: 45px;
            width: 75px;
            height: 75px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            background: transparent;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            color: white;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
        }

        .lang-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('media_files/language.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -1;
            transition: all 0.3s ease;
            border-radius: 0;
        }

        .lang-button:hover::before {
            background-image: url('media_files/language_hovered.png');
        }

        .lang-button:hover {
            transform: translateY(-3px);
        }

        .lang-button:active {
            transform: translateY(0);
        }

        /* Estilos de secciones */
        .base-version-section {
            margin-bottom: 20px;
            border-bottom: 2px solid rgba(255, 215, 0, 0.3);
            padding-bottom: 10px;
        }

        .base-version-title {
            color: #FFD700;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            text-align: center;
        }

        .version-item.base-version {
            border-color: #FFD700;
            background: rgba(255, 215, 0, 0.1);
        }

        .version-item.base-version .version-id {
            color: #FFD700;
        }

        .updates-section {
            margin-top: 10px;
        }

        .updates-title {
            color: #4CAF50;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            text-align: center;
        }

        .version-item {
            padding: 12px 15px;
            margin-bottom: 8px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.05);
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .version-item:first-child.selected {
            border-color: #4CAF50;
            background: rgba(76, 175, 80, 0.15);
        }

        .version-item.selected:not(:first-child) {
            border-color: #808080;
            background: rgba(128, 128, 128, 0.15);
        }

        .version-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .version-info {
            flex: 1;
        }

        .version-id {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 5px;
            color: #fff;
        }

        .version-date {
            font-size: 0.9em;
            color: #ccc;
            opacity: 0.8;
        }

        .version-button {
            width: 40px;
            height: 40px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            background: transparent;
            position: relative;
            overflow: hidden;
            margin-left: 10px;
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4em;
            color: white;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
            z-index: 2;
        }

        .version-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('media_files/square_button.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -1;
            transition: all 0.3s ease;
            border-radius: 0;
        }

        .version-button:hover::before {
            background-image: url('media_files/square_button_highlighted.png');
        }

        .version-button:hover {
            transform: translateY(-2px);
        }

        .version-button:active {
            transform: translateY(0);
        }

        /* Modales */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: rgba(40, 40, 40, 0.95);
            border: 3px solid rgba(255, 255, 255, 0.3);
            padding: 30px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
            border-radius: 0;
        }

        .modal-title {
            color: #fff;
            font-size: 2em;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 15px;
        }

        .modal-buttons {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .modal-buttons.two-buttons {
            justify-content: space-between;
        }

        .modal-button {
            width: 150px;
            height: 150px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            background: transparent;
            position: relative;
            overflow: hidden;
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .modal-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('media_files/square_button.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -1;
            transition: all 0.3s ease;
            border-radius: 0;
        }

        .modal-button:hover::before {
            background-image: url('media_files/square_button_highlighted.png');
            transform: scale(1.05);
        }

        .modal-button:hover {
            transform: translateY(-5px);
        }

        .modal-button:active {
            transform: translateY(0);
        }

        .modal-button img {
            max-width: 65%;
            max-height: 65%;
            object-fit: contain;
        }

        .lang-modal-button {
            width: 200px;
            height: 60px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            background: transparent;
            position: relative;
            overflow: hidden;
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            font-size: 1.2em;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            margin: 8px auto;
        }

        .lang-modal-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('media_files/button.png');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -1;
            transition: all 0.3s ease;
            border-radius: 0;
        }

        .lang-modal-button:hover::before {
            background-image: url('media_files/button_highlighted.png');
            transform: scale(1.02);
        }

        .lang-modal-button:hover {
            transform: translateY(-2px);
        }

        .lang-modal-button:active {
            transform: translateY(0);
        }

        .versions-title {
            text-align: center;
            margin-bottom: 20px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            font-size: 1.4em;
            font-weight: bold;
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 10px;
        }

        .changelog-content {
            line-height: 1.6;
            color: #e0e0e0;
        }

        .changelog-content h1,
        .changelog-content h2,
        .changelog-content h3,
        .changelog-content h4,
        .changelog-content h5,
        .changelog-content h6 {
            color: #fff;
            margin: 15px 0 12px 0;
            font-weight: bold;
        }

        .changelog-content h1 {
            font-size: 1.8em;
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 8px;
            margin-top: 5px;
        }

        .changelog-content h2 {
            font-size: 1.6em;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 5px;
        }

        .changelog-content h3 {
            font-size: 1.4em;
            margin-top: 15px;
        }

        .changelog-content p {
            margin-bottom: 14px;
            line-height: 1.7;
        }

        .changelog-content ul,
        .changelog-content ol {
            margin: 14px 0;
            padding-left: 25px;
        }

        .changelog-content li {
            margin-bottom: 6px;
            line-height: 1.5;
        }

        .changelog-content code {
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            color: #ffcc00;
        }

        .changelog-content pre {
            background: rgba(0, 0, 0, 0.5);
            padding: 14px;
            border-radius: 5px;
            overflow-x: auto;
            margin: 16px 0;
            border-left: 3px solid rgba(255, 255, 255, 0.2);
        }

        .changelog-content pre code {
            background: none;
            padding: 0;
            color: #e0e0e0;
            font-size: 0.95em;
        }

        .changelog-content blockquote {
            border-left: 4px solid rgba(255, 255, 255, 0.3);
            padding-left: 16px;
            margin: 16px 0;
            color: #ccc;
            font-style: italic;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 16px;
            border-radius: 0 5px 5px 0;
        }

        .changelog-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
        }

        .changelog-content th,
        .changelog-content td {
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: left;
        }

        .changelog-content th {
            background: rgba(255, 255, 255, 0.1);
            font-weight: bold;
        }

        .changelog-content a {
            color: #4CAF50;
            text-decoration: none;
        }

        .changelog-content a:hover {
            text-decoration: underline;
        }

        .loading {
            text-align: center;
            color: #ccc;
            font-style: italic;
            padding: 20px 0;
        }

        .error {
            color: #ff6b6b;
            text-align: center;
            padding: 20px 0;
        }

        .sidebar::-webkit-scrollbar,
        .main-content::-webkit-scrollbar {
            width: 8px;
        }

        .sidebar::-webkit-scrollbar-track,
        .main-content::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
        }

        .sidebar::-webkit-scrollbar-thumb,
        .main-content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
        }

        .sidebar::-webkit-scrollbar-thumb:hover,
        .main-content::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        @media (max-width: 768px) {
            .content-container {
                flex-direction: column;
                gap: 2vh;
            }
            
            .sidebar {
                width: 90%;
                height: 25vh;
            }
            
            .main-content {
                width: 90%;
                height: 40vh;
                padding: 0px 15px;
            }
            
            .version-button {
                width: 35px;
                height: 35px;
                font-size: 1.2em;
            }

            .modal-buttons {
                flex-direction: column;
                gap: 20px;
            }

            .modal-button {
                width: 120px;
                height: 120px;
            }

            .kofi-button {
                width: 50px;
                height: 50px;
                font-size: 1.6em;
                top: 20px;
                left: 20px;
            }

            .lang-button {
                width: 50px;
                height: 50px;
                font-size: 1.6em;
                top: 20px;
                right: 20px;
            }

            .lang-modal-button {
                width: 160px;
                height: 50px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="video-background">
        <video autoplay muted loop playsinline>
            <source src="media_files/animated_blurry_chimney.mp4" type="video/mp4">
            Tu navegador no soporta el elemento de video.
        </video>
        <div class="video-overlay"></div>
    </div>

    <div class="header">
        <div class="logo">
            <img src="media_files/logo.png" alt="Logo del Juego">
        </div>
    </div>

    <div class="content-container">
        <div class="sidebar">
            <div class="versions-title" id="versionsTitle">VERSIONES</div>
            <div id="versions-list"></div>
        </div>

        <div class="main-content" id="version-details">
            <div class="loading" id="selectVersionMsg">Selecciona una versión para ver los detalles</div>
        </div>
    </div>

    <!-- Botón Ko-fi -->
    <button class="kofi-button" onclick="window.open('https://ko-fi.com/kartillomc2', '_blank')"></button>

    <!-- Botón de idioma -->
    <button class="lang-button" id="langButton"></button>

    <!-- Modal de descarga -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <div class="modal-title" id="modalTitle">v0.0.0</div>
            <div class="modal-buttons" id="modalButtonsContainer"></div>
        </div>
    </div>

    <!-- Modal de idioma -->
    <div class="modal-overlay" id="langModalOverlay">
        <div class="modal-content">
            <div class="modal-title" id="langModalTitle">🌐 SELECCIONAR IDIOMA</div>
            <div id="langButtonsContainer"></div>
        </div>
    </div>

    <script>
        // ============================================================
        // CONFIGURACIÓN
        // ============================================================
        const META_JSON_URL = 'https://raw.githubusercontent.com/Kart0/MINECRAFT-1.5/refs/heads/main/meta.json';
        const BASE_VERSION_ID = '0.2.0';
        const LANG_FILES_PATH = 'lang_files/';
        const CHANGELOG_BASE_URL = 'https://raw.githubusercontent.com/Kart0/MINECRAFT-1.5/main/versions/';

        const SUPPORTED_LANGS = ['es', 'en', 'pt', 'ru'];
        const LANG_NAMES = {
            es: 'ESPAÑOL',
            en: 'ENGLISH',
            pt: 'PORTUGUÊS',
            ru: 'РУССКИЙ'
        };
        const FALLBACK_LANG = 'en';

        let currentLang = FALLBACK_LANG;
        let translations = {};
        let currentVersionId = '';
        let currentVersionData = null;
        let versionsData = [];

        // ============================================================
        // FUNCIONES DE IDIOMA
        // ============================================================

        function detectBrowserLanguage() {
            const langs = navigator.languages || [navigator.language];
            for (let l of langs) {
                const base = l.split('-')[0].toLowerCase();
                if (SUPPORTED_LANGS.includes(base)) {
                    console.log(`Idioma detectado: ${base}`);
                    return base;
                }
            }
            console.log(`Ningún idioma soportado detectado, usando fallback: ${FALLBACK_LANG}`);
            return FALLBACK_LANG;
        }

        async function loadTranslations(lang) {
            try {
                const url = `${LANG_FILES_PATH}${lang}.json?t=${Date.now()}`;
                console.log(`Cargando traducciones desde: ${url}`);
                const resp = await fetch(url);
                if (!resp.ok) {
                    console.warn(`Error ${resp.status} al cargar ${lang}.json`);
                    if (lang !== FALLBACK_LANG) {
                        return await loadTranslations(FALLBACK_LANG);
                    }
                    return {};
                }
                const data = await resp.json();
                console.log(`Traducciones cargadas para ${lang}:`, data);
                return data;
            } catch (e) {
                console.error(`Error en loadTranslations para ${lang}:`, e);
                if (lang !== FALLBACK_LANG) {
                    return await loadTranslations(FALLBACK_LANG);
                }
                return {};
            }
        }

        function applyTranslations() {
            const t = translations;
            console.log('Aplicando traducciones:', t);
            
            // Título del navegador
            if (t.browser_title) {
                document.title = t.browser_title;
                document.getElementById('browserTitle').textContent = t.browser_title;
            }
            
            // Título de versiones
            const titleEl = document.getElementById('versionsTitle');
            if (titleEl) titleEl.textContent = t.versions_title || 'VERSIONES';
            
            // Mensaje de selección
            const selectMsg = document.getElementById('selectVersionMsg');
            if (selectMsg) {
                selectMsg.textContent = t.select_version || 'Selecciona una versión para ver los detalles';
            }

            // Guardar títulos de sección para usar al crear los elementos
            window._baseTitleText = t.base_version_title || '⚡ VERSIÓN BASE ⚡';
            window._updatesTitleText = t.updates_title || '📦 ACTUALIZACIONES 📦';
            
            // Actualizar títulos de sección ya existentes (si los hay)
            const baseTitleEl = document.querySelector('.base-version-title');
            if (baseTitleEl) baseTitleEl.textContent = window._baseTitleText;
            
            const updatesTitleEl = document.querySelector('.updates-title');
            if (updatesTitleEl) updatesTitleEl.textContent = window._updatesTitleText;

            // Si hay versión seleccionada, recargar changelog
            if (currentVersionId) {
                showVersionDetails(currentVersionId);
            }
        }

        async function setLanguage(lang) {
            if (!SUPPORTED_LANGS.includes(lang)) {
                lang = FALLBACK_LANG;
            }
            currentLang = lang;
            localStorage.setItem('selectedLanguage', lang);
            console.log(`Cambiando idioma a: ${lang}`);
            
            translations = await loadTranslations(lang);
            applyTranslations();
            
            // Si hay versión seleccionada, recargar detalles
            if (currentVersionId) {
                await showVersionDetails(currentVersionId);
            }
        }

        async function initLanguage() {
            let saved = localStorage.getItem('selectedLanguage');
            if (saved && SUPPORTED_LANGS.includes(saved)) {
                currentLang = saved;
                console.log(`Idioma restaurado de localStorage: ${currentLang}`);
            } else {
                currentLang = detectBrowserLanguage();
            }
            translations = await loadTranslations(currentLang);
            applyTranslations();
        }

        // ============================================================
        // MODALES
        // ============================================================

        function cerrarModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        function abrirModal(modalId) {
            document.getElementById(modalId).classList.add('active');
        }

        // ============================================================
        // MODAL DE DESCARGA
        // ============================================================

        function mostrarModalDescarga(versionId) {
            currentVersionId = versionId;
            currentVersionData = versionsData.find(v => v.id === versionId);
            
            const modalTitle = document.getElementById('modalTitle');
            modalTitle.textContent = `v${versionId}`;
            
            const container = document.getElementById('modalButtonsContainer');
            container.innerHTML = '';
            container.classList.remove('two-buttons');

            if (versionId === BASE_VERSION_ID) {
                const downloads = currentVersionData?.promotions?.downloads || {};
                const baseUrl = downloads.base || null;
                const liteUrl = downloads.base_lite || null;

                if (baseUrl) {
                    const btn = createModalButton('media_files/modpack_logo.png', 'Base', () => {
                        window.open(baseUrl, '_blank');
                        cerrarModal('modalOverlay');
                    });
                    container.appendChild(btn);
                }

                if (liteUrl) {
                    const btn = createModalButton('media_files/modpack_logo_lite.png', 'Base Lite', () => {
                        window.open(liteUrl, '_blank');
                        cerrarModal('modalOverlay');
                    });
                    container.appendChild(btn);
                }

                if (container.children.length === 2) {
                    container.classList.add('two-buttons');
                }

                if (container.children.length === 0) {
                    container.innerHTML = `<p style="color:white;">${translations.no_download_links || 'No hay enlaces de descarga disponibles.'}</p>`;
                }
            } else {
                const downloads = currentVersionData?.promotions?.downloads || {};
                const baseUrl = downloads.base || null;
                
                if (baseUrl) {
                    const btn = createModalButton('media_files/modpack_logo.png', 'Descargar', () => {
                        window.open(baseUrl, '_blank');
                        cerrarModal('modalOverlay');
                    });
                    container.appendChild(btn);
                } else {
                    const modrinthUrl = downloads.modrinth || null;
                    const genericUrl = downloads.generic || null;
                    
                    if (modrinthUrl) {
                        const btn = createModalButton('media_files/Modrinth_Logo.png', 'Modrinth', () => {
                            window.open(modrinthUrl, '_blank');
                            cerrarModal('modalOverlay');
                        });
                        container.appendChild(btn);
                    }
                    
                    if (genericUrl) {
                        const btn = createModalButton('media_files/SKLauncher_Logo.png', 'SKLauncher', () => {
                            window.open(genericUrl, '_blank');
                            cerrarModal('modalOverlay');
                        });
                        container.appendChild(btn);
                    }
                }

                if (container.children.length === 0) {
                    container.innerHTML = `<p style="color:white;">${translations.no_download_links || 'No hay enlaces de descarga disponibles.'}</p>`;
                }
            }
            
            abrirModal('modalOverlay');
        }

        function createModalButton(imgSrc, alt, onclick) {
            const btn = document.createElement('button');
            btn.className = 'modal-button';
            const img = document.createElement('img');
            img.src = imgSrc;
            img.alt = alt;
            btn.appendChild(img);
            btn.onclick = onclick;
            return btn;
        }

        // ============================================================
        // MODAL DE IDIOMA
        // ============================================================

        function mostrarModalIdioma() {
            const container = document.getElementById('langButtonsContainer');
            container.innerHTML = '';
            
            SUPPORTED_LANGS.forEach(lang => {
                const btn = document.createElement('button');
                btn.className = 'lang-modal-button';
                btn.textContent = LANG_NAMES[lang];
                btn.onclick = async () => {
                    await setLanguage(lang);
                    cerrarModal('langModalOverlay');
                    if (currentVersionId) {
                        await showVersionDetails(currentVersionId);
                    }
                };
                container.appendChild(btn);
            });

            document.getElementById('langModalTitle').textContent = translations.select_language_title || '🌐 SELECCIONAR IDIOMA';
            
            abrirModal('langModalOverlay');
        }

        // ============================================================
        // CHANGELOG
        // ============================================================

        async function loadChangelogFromGitHub(versionId, lang) {
            try {
                const url = `${CHANGELOG_BASE_URL}${versionId}/changelog_${lang}.txt?t=${Date.now()}`;
                console.log(`Cargando changelog desde: ${url}`);
                const response = await fetch(url);
                if (!response.ok) {
                    console.warn(`No se encontró changelog_${lang}.txt para ${versionId}, intentando con fallback.`);
                    if (lang !== FALLBACK_LANG) {
                        return await loadChangelogFromGitHub(versionId, FALLBACK_LANG);
                    }
                    return null;
                }
                return await response.text();
            } catch (error) {
                console.error(`Error cargando changelog para ${versionId} en ${lang}:`, error);
                if (lang !== FALLBACK_LANG) {
                    return await loadChangelogFromGitHub(versionId, FALLBACK_LANG);
                }
                return null;
            }
        }

        async function showVersionDetails(versionId) {
            const detailsContainer = document.getElementById('version-details');
            detailsContainer.innerHTML = `<div class="loading">${translations.loading || 'Cargando changelog...'}</div>`;
            try {
                const content = await loadChangelogFromGitHub(versionId, currentLang);
                if (content) {
                    detailsContainer.innerHTML = `<div class="changelog-content">${marked.parse(content)}</div>`;
                } else {
                    detailsContainer.innerHTML = `<div class="error">${translations.error_no_changelog || 'No se encontró el changelog para esta versión'}</div>`;
                }
            } catch (error) {
                console.error(error);
                detailsContainer.innerHTML = `<div class="error">${translations.error_loading || 'Error cargando el changelog de la versión'}</div>`;
            }
        }

        // ============================================================
        // LISTA DE VERSIONES
        // ============================================================

        function hasDownloadLinks(version) {
            const d = version?.promotions?.downloads;
            if (!d) return false;
            return !!(d.base || d.base_lite || d.modrinth || d.generic);
        }

        function createVersionElement(version, isBaseVersion = false) {
            const el = document.createElement('div');
            el.className = 'version-item';
            if (isBaseVersion) {
                el.classList.add('base-version');
                el.classList.add('selected');
            }
            
            const hasLinks = hasDownloadLinks(version);
            const btnHtml = hasLinks ? 
                `<button class="version-button" onclick="mostrarModalDescarga('${version.id}')">⤓</button>` : '';
            
            el.innerHTML = `
                <div class="version-info">
                    <div class="version-id">${version.id}</div>
                    <div class="version-date">${formatDate(version.releasedAt)}</div>
                </div>
                ${btnHtml}
            `;
            
            el.addEventListener('click', () => {
                document.querySelectorAll('.version-item').forEach(item => item.classList.remove('selected'));
                el.classList.add('selected');
                showVersionDetails(version.id);
            });
            
            return el;
        }

        function formatDate(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleDateString('es-ES', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric'
            });
        }

        async function loadVersions() {
            try {
                const resp = await fetch(META_JSON_URL + '?t=' + Date.now());
                const data = await resp.json();
                versionsData = data.versions;
                
                const list = document.getElementById('versions-list');
                list.innerHTML = '';

                const baseVersion = versionsData.find(v => v.id === BASE_VERSION_ID);
                const otherVersions = versionsData.filter(v => v.id !== BASE_VERSION_ID);
                const sortedOthers = otherVersions.sort((a, b) => b.releasedAt - a.releasedAt);

                // Sección base
                const baseSection = document.createElement('div');
                baseSection.className = 'base-version-section';
                const baseTitle = document.createElement('div');
                baseTitle.className = 'base-version-title';
                baseTitle.textContent = window._baseTitleText || '⚡ VERSIÓN BASE ⚡';
                baseSection.appendChild(baseTitle);
                
                if (baseVersion) {
                    baseSection.appendChild(createVersionElement(baseVersion, true));
                }
                list.appendChild(baseSection);

                // Sección actualizaciones
                if (sortedOthers.length > 0) {
                    const updatesSection = document.createElement('div');
                    updatesSection.className = 'updates-section';
                    const updatesTitle = document.createElement('div');
                    updatesTitle.className = 'updates-title';
                    updatesTitle.textContent = window._updatesTitleText || '📦 ACTUALIZACIONES 📦';
                    updatesSection.appendChild(updatesTitle);
                    
                    sortedOthers.forEach(version => {
                        updatesSection.appendChild(createVersionElement(version, false));
                    });
                    list.appendChild(updatesSection);
                }

                // Seleccionar base por defecto
                if (baseVersion) {
                    currentVersionId = baseVersion.id;
                    await showVersionDetails(baseVersion.id);
                } else if (sortedOthers.length > 0) {
                    currentVersionId = sortedOthers[0].id;
                    await showVersionDetails(sortedOthers[0].id);
                }
            } catch (error) {
                console.error('Error cargando versiones:', error);
                document.getElementById('versions-list').innerHTML = `<div class="error">${translations.error_versions || 'Error cargando versiones'}</div>`;
            }
        }

        // ============================================================
        // INICIO
        // ============================================================

        document.addEventListener('DOMContentLoaded', async function() {
            // Video
            const video = document.querySelector('video');
            video.play().catch(e => console.log('Error al reproducir el video:', e));

            // Inicializar idioma
            await initLanguage();

            // Cargar versiones
            await loadVersions();

            // Eventos de modales
            document.getElementById('modalOverlay').addEventListener('click', function(e) {
                if (e.target === this) cerrarModal('modalOverlay');
            });
            document.getElementById('langModalOverlay').addEventListener('click', function(e) {
                if (e.target === this) cerrarModal('langModalOverlay');
            });

            // Botón de idioma
            document.getElementById('langButton').addEventListener('click', mostrarModalIdioma);
        });
    </script>
</body>
</html>
